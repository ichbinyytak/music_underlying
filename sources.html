<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY-Music 底层音源调度控制台</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
      color: #202124;
      padding: 30px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .header {
      background: #ffffff;
      padding: 24px 28px;
      border-radius: 12px;
      border: 1px solid #dadce0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title h1 {
      font-size: 20px;
      font-weight: 600;
      color: #202124;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title p {
      font-size: 13px;
      color: #5f6368;
      margin-top: 4px;
    }
    .btn {
      height: 38px;
      padding: 0 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .btn-primary {
      background-color: #1a73e8;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1557b0;
    }
    .btn-outline {
      background-color: #ffffff;
      color: #3c4043;
      border-color: #dadce0;
    }
    .btn-outline:hover {
      background-color: #f1f3f4;
      border-color: #bdc1c6;
    }

    /* 状态指示条 */
    .status-bar {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }
    .status-tag {
      background: #e8f0fe;
      color: #1967d2;
      padding: 4px 10px;
      border-radius: 14px;
      font-weight: 500;
    }

    /* 卡片通用样式 */
    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dadce0;
      padding: 22px 26px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #202124;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 调度队列布局 */
    .source-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .source-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
      transition: all 0.2s;
    }
    .source-item:hover {
      border-color: #1a73e8;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .source-item.tier-primary {
      border-left: 4px solid #1a73e8;
      background: #ffffff;
    }
    .source-item.tier-secondary {
      border-left: 4px solid #34a853;
      background: #ffffff;
    }
    .source-item.tier-failed {
      border-left: 4px solid #ea4335;
      opacity: 0.7;
    }

    .source-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }
    .rank-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e8eaed;
      color: #3c4043;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }
    .rank-badge.top-1 { background: #fef7e0; color: #b06000; }
    .rank-badge.top-2 { background: #e8f0fe; color: #1a73e8; }
    .rank-badge.top-3 { background: #e6f4ea; color: #137333; }

    .source-name {
      font-weight: 500;
      font-size: 14px;
      color: #202124;
    }
    .platform-pill {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #f1f3f4;
      color: #5f6368;
      font-weight: 600;
      text-transform: uppercase;
    }
    .tier-label {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .tier-label.rush { background: #e8f0fe; color: #1967d2; }
    .tier-label.backup { background: #e6f4ea; color: #137333; }
    .tier-label.isolated { background: #fce8e6; color: #c5221f; }

    .source-stats {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
    }
    .latency-val {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .latency-val.fast { color: #188038; }
    .latency-val.medium { color: #e37400; }
    .latency-val.bad { color: #d93025; }

    /* 实战取链测试区 */
    .test-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .input-group {
      display: flex;
      gap: 10px;
    }
    .input-text {
      flex: 1;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-text:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
    }
    .result-console {
      background: #202124;
      color: #e8eaed;
      border-radius: 8px;
      padding: 14px 18px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .audio-player-wrap {
      margin-top: 10px;
      display: none;
      align-items: center;
      gap: 12px;
      background: #f1f3f4;
      padding: 10px 16px;
      border-radius: 8px;
    }
    .audio-player-wrap audio {
      flex: 1;
      height: 36px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 头部信息栏 -->
    <header class="header">
      <div class="header-title">
        <h1>⚡ YY-Music 音源核心引擎控制台</h1>
        <p>数据源全量同步自: <a href="https://ichbinyytak.github.io/lx-hub/" target="_blank" style="color:#1a73e8;text-decoration:none;">ichbinyytak.github.io/lx-hub</a> (32个社区源 + 4个原生源)</p>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" id="btnSync" onclick="syncFromHub()">
          <span>🔄</span>
          <span>同步 lx-hub</span>
        </button>
        <button class="btn btn-primary" id="btnTestAll" onclick="testAllSources()">
          <span>⚡</span>
          <span>并发测速重排</span>
        </button>
      </div>
    </header>

    <!-- 音源当前排班列表 -->
    <section class="card">
      <div class="card-title">
        <span>当前音源调度队列（按实测延迟与动态命中率实时排序）</span>
        <div class="status-bar" id="statusBar">
          <span class="status-tag">正在初始化...</span>
        </div>
      </div>

      <div class="source-list" id="sourceList">
        <!-- 动态渲染队列 -->
      </div>
    </section>

    <!-- 实战验证区：搜歌与双核竞速点播 -->
    <section class="card">
      <div class="card-title">
        <span>实战演练：正版歌曲检索与双核并发秒开取链</span>
      </div>
      <div class="test-box">
        <div class="input-group">
          <input type="text" class="input-text" id="songInput" value="海阔天空 Beyond" placeholder="输入歌名 歌手 (如: 海阔天空 Beyond / 晴天 周杰伦)...">
          <button class="btn btn-primary" onclick="resolveAndPlay()">
            <span>▶</span>
            <span>双核竞速取链并试听</span>
          </button>
        </div>

        <div class="result-console" id="consoleLog">点击【双核竞速取链并试听】测试真实寻源链路...</div>

        <div class="audio-player-wrap" id="playerWrap">
          <span style="font-size: 13px; font-weight: 500; color: #202124;" id="playerLabel">试听播放:</span>
          <audio id="audioElement" controls></audio>
        </div>
      </div>
    </section>
  </div>

  <script>
    async function loadSources() {
      try {
        const resp = await fetch('/api/sources');
        const data = await resp.json();
        renderSourceList(data);
      } catch (e) {
        document.getElementById('sourceList').innerHTML = `<p style="color:#d93025;padding:12px;">加载音源列表失败: ${e.message}</p>`;
      }
    }

    function renderSourceList(sources) {
      const container = document.getElementById('sourceList');
      container.innerHTML = '';
      
      const healthyCount = sources.filter(s => s.status === 'ok').length;
      document.getElementById('statusBar').innerHTML = `
        <span class="status-tag">在线源: ${healthyCount} / ${sources.length}</span>
        <span class="status-tag" style="background:#e6f4ea;color:#137333;">双核主力冲刺: 前2强</span>
      `;

      sources.forEach((s, idx) => {
        const item = document.createElement('div');
        let tierClass = 'tier-primary';
        let tierText = '第1轮双核主力';
        let tierStyle = 'rush';

        if (s.status !== 'ok') {
          tierClass = 'tier-failed';
          tierText = '异常/失效';
          tierStyle = 'isolated';
        } else if (idx === 0) {
          tierText = '🥇 状元 (第1主力)';
          tierStyle = 'rush';
        } else if (idx === 1) {
          tierText = '🥈 榜眼 (第1主力)';
          tierStyle = 'rush';
        } else if (idx === 2 || idx === 3) {
          tierClass = 'tier-secondary';
          tierText = '备用兜底 (第2轮)';
          tierStyle = 'backup';
        } else {
          tierClass = 'tier-secondary';
          tierText = '常备源池';
          tierStyle = 'backup';
        }

        item.className = `source-item ${tierClass}`;

        let latencyDisplay = '<span class="latency-val bad">× 超时/异常</span>';
        if (s.status === 'ok') {
          const latClass = s.latency_ms < 600 ? 'fast' : (s.latency_ms < 1200 ? 'medium' : 'bad');
          latencyDisplay = `<span class="latency-val ${latClass}">● ${s.latency_ms.toFixed(1)}ms</span>`;
        }

        const rankClass = idx === 0 ? 'top-1' : (idx === 1 ? 'top-2' : (idx === 2 ? 'top-3' : ''));

        item.innerHTML = `
          <div class="source-info">
            <div class="rank-badge ${rankClass}">${idx + 1}</div>
            <div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="source-name">${s.name}</span>
                <span class="platform-pill">${s.platform}</span>
                <span class="tier-label ${tierStyle}">${tierText}</span>
              </div>
              <div style="font-size:12px;color:#70757a;margin-top:2px;">
                ID: ${s.id} · 实战胜出: ${s.success_count || 0}次 · 连失: ${s.consecutive_fails || 0}次
              </div>
            </div>
          </div>
          <div class="source-stats">
            ${latencyDisplay}
          </div>
        `;
        container.appendChild(item);
      });
    }

    async function syncFromHub() {
      const btn = document.getElementById('btnSync');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span><span>正在同步 lx-hub...</span>';
      try {
        const resp = await fetch('/api/sources/sync', { method: 'POST' });
        const sources = await resp.json();
        renderSourceList(sources);
        alert('成功同步 lx-hub 全部 32 个音源并完成就地测速！');
      } catch (e) {
        alert('同步失败: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🔄</span><span>同步 lx-hub</span>';
      }
    }

    async function testAllSources() {
      const btn = document.getElementById('btnTestAll');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span><span>正在就地并发测速...</span>';
      try {
        const resp = await fetch('/api/sources/test', { method: 'POST' });
        const sources = await resp.json();
        renderSourceList(sources);
      } catch (e) {
        alert('测速失败: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>⚡</span><span>并发测速并重新排序</span>';
      }
    }

    async function resolveAndPlay() {
      const q = document.getElementById('songInput').value.trim();
      const consoleBox = document.getElementById('consoleLog');
      const playerWrap = document.getElementById('playerWrap');
      const audio = document.getElementById('audioElement');

      if (!q) {
        alert('请输入歌名');
        return;
      }

      consoleBox.innerText = `[1/3] 正在对关键词 『${q}』 执行前置 1ms 正规录音室打分与去翻唱检索...`;
      playerWrap.style.display = 'none';

      try {
        // 步骤 1: 搜索正版候选
        const sResp = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const cands = await sResp.json();

        if (!cands || cands.length === 0) {
          consoleBox.innerText += `\n[错误] 未能匹配到符合条件的录音室正版单曲 (已过滤所有翻唱/伴奏/低分候选)`;
          return;
        }

        const topCand = cands[0];
        consoleBox.innerText += `\n[2/3] 检索成功！筛选出及格正版候选 ${cands.length} 首。\n      状元候选: 《${topCand.title}》- ${topCand.artist} [得分: ${topCand.score}, 平台: ${topCand.platform}]`;
        consoleBox.innerText += `\n[3/3] 派出当前排名前2强音源，执行双核并发冲刺取链...`;

        // 步骤 2: 双核并发全量冲刺取链
        const rResp = await fetch('/api/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(topCand)
        });
        const res = await rResp.json();

        // 渲染每一轮冲刺的实时战报
        if (res.rounds_log && res.rounds_log.length > 0) {
          consoleBox.innerText += `\n\n【双核并发冲刺全流程战报 (双源轮番出战，直到命中)】:`;
          res.rounds_log.forEach(r => {
            const statusIcon = r.status === 'hit' ? '✓ 命中出声！' : '× 未命中，顺延';
            consoleBox.innerText += `\n  - 第 ${r.round} 轮冲刺: [${r.sources.join(' 与 ')}] -> ${statusIcon} ${r.winner ? '🏆 胜出者: ' + r.winner : ''}`;
          });
        }

        if (res.success && res.url) {
          const mb = (res.bytes / (1024 * 1024)).toFixed(2);
          consoleBox.innerText += `\n\n🎉 取链成功！\n  胜出音源: ${res.source_name}\n  决胜轮次: 第 ${res.round} 轮双核冲刺\n  音频大小: ${mb} MB (零试听防线通过)\n  播放直链: ${res.url}`;
          
          document.getElementById('playerLabel').innerText = `正在播放: ${res.title} - ${res.artist} [由 ${res.source_name} 胜出提供]`;
          audio.src = res.url;
          playerWrap.style.display = 'flex';
          audio.play().catch(() => {});

          // 重新刷新左侧音源排行榜（展示实战胜出计数）
          loadSources();
        } else {
          consoleBox.innerText += `\n\n× 取链失败: ${res.error || '全库所有音源均未返回有效全曲'}`;
        }
      } catch (e) {
        consoleBox.innerText += `\n\n[异常中断] ${e.message}`;
      }
    }

    // 初始化加载
    loadSources();
  </script>
</body>
</html>
