<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY-Music Underlying Core · yy-lx-hub 驱动</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #222;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    .app-main { display: flex; flex: 1; min-height: 0; }

    /* 左侧：yy-lx-hub 真实音源面板 */
    .module-sources {
      width: 280px;
      border-right: 1px solid #e0e0e0;
      background: #fbfbfb;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
    }
    .module-sources .header { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .module-sources h2 { font-size: 13px; color: #333; }
    .sync-meta { font-size: 11px; color: #888; }
    .module-sources button {
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
    }
    .module-sources button:disabled { opacity: 0.6; cursor: wait; }

    .source-list { list-style: none; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .source-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 4px;
      font-size: 11px;
    }
    .source-item.top { border-color: #b7e1cd; background: #f6fbf7; font-weight: 500; }
    .source-item.fail { border-color: #fad2cf; background: #fef7f6; }
    .source-name {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .plat-tag {
      display: inline-block;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }
    .plat-tx { background: #16a34a; }
    .plat-wy { background: #dc2626; }
    .plat-kw { background: #d97706; }
    .plat-kg { background: #2563eb; }
    .plat-mg { background: #db2777; }
    .mode-tag {
      font-size: 10px;
      color: #666;
      background: #f1f3f4;
      padding: 0 3px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .status-ok { color: #0f9d58; font-family: monospace; flex-shrink: 0; }
    .status-fail { color: #d93025; font-size: 10px; flex-shrink: 0; }
    .status-wait { color: #888; font-size: 10px; flex-shrink: 0; }

    /* 中央：五平台聚合搜索 */
    .module-search { flex: 1; display: flex; flex-direction: column; padding: 16px 20px; min-width: 0; gap: 12px; }
    .search-bar { display: flex; gap: 8px; max-width: 660px; width: 100%; }
    .search-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }
    .search-bar button {
      padding: 8px 16px;
      border: 1px solid #1a73e8;
      background: #1a73e8;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .search-bar .btn-secondary { background: #fff; color: #333; border-color: #ccc; }

    .table-container { flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #eee; }
    th { background: #fafafa; color: #666; font-weight: 500; font-size: 12px; position: sticky; top: 0; z-index: 1; }
    tr:hover { background: #f8f9fa; }
    tr.playing { background: #e8f0fe; font-weight: 500; }
    .play-action {
      padding: 3px 10px;
      font-size: 11px;
      border: 1px solid #1a73e8;
      background: #fff;
      color: #1a73e8;
      border-radius: 12px;
      cursor: pointer;
    }
    .badge { font-size: 10px; background: #e6f4ea; color: #137333; padding: 2px 6px; border-radius: 8px; }

    /* 底部播放栏 */
    .module-player {
      border-top: 1px solid #e0e0e0;
      background: #fff;
      display: flex;
      flex-direction: column;
      padding: 6px 16px 10px 16px;
      gap: 6px;
    }
    .progress-bar { width: 100%; height: 5px; background: #e0e0e0; border-radius: 3px; cursor: pointer; }
    .progress-fill { width: 0%; height: 100%; background: #1a73e8; border-radius: 3px; }
    .player-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .track-cell { width: 280px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .track-cell strong { font-size: 13px; color: #111; }
    .track-cell small { display: block; color: #1e8e3e; font-size: 11px; font-family: monospace; overflow: hidden; text-overflow: ellipsis; }
    .track-cell small.err { color: #d93025; }
    .lyric-cell {
      flex: 1;
      text-align: center;
      color: #1a73e8;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
    }
    .controls-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .time-txt { font-size: 11px; color: #777; font-family: monospace; }
    .controls-cell button {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .controls-cell button.btn-main { background: #1a73e8; color: #fff; border-color: #1a73e8; font-size: 14px; width: 36px; height: 36px; }
    .controls-cell button.btn-mode { width: auto; border-radius: 12px; padding: 0 8px; font-size: 11px; }

    @media (max-width: 768px) {
      .app-main { flex-direction: column; }
      .module-sources { width: 100%; max-height: 170px; border-right: none; border-bottom: 1px solid #e0e0e0; }
      .track-cell { width: 150px; }
    }
  </style>
</head>
<body>
  <div class="app-main">
    <aside class="module-sources">
      <div class="header">
        <h2 id="sourcesTitle">音源模块 (加载中)</h2>
        <button id="btnSpeed" onclick="speedTest()">⚡ 实测重排</button>
      </div>
      <div class="sync-meta" id="syncMeta">正在读取 yy-lx-hub 清单...</div>
      <ul class="source-list" id="sourceList">
        <li style="color:#888;padding:10px 0;">加载音源中...</li>
      </ul>
    </aside>

    <main class="module-search">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="输入歌名/歌手（五平台并发搜索：晴天 周杰伦）"
          value="晴天 周杰伦"
          onkeydown="if(event.key==='Enter') search()"
        >
        <button id="btnSearch" onclick="search()">搜索</button>
        <button class="btn-secondary" onclick="showDefaultPlaylist()">默认歌单</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width:40px;">#</th>
              <th style="width:58px;">平台</th>
              <th>歌名</th>
              <th>歌手</th>
              <th>专辑</th>
              <th style="width:65px;">时长</th>
              <th style="width:72px;">匹配度</th>
              <th style="width:65px;">操作</th>
            </tr>
          </thead>
          <tbody id="songList"></tbody>
        </table>
      </div>
    </main>
  </div>

  <footer class="module-player">
    <div class="progress-bar" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="player-row">
      <div class="track-cell">
        <strong id="trackTitle">未播放</strong>
        <small id="trackMeta">就绪 · yy-lx-hub 引擎</small>
      </div>
      <div class="lyric-cell" id="lyricText">♪ YY-Music Underlying Core ♪</div>
      <div class="controls-cell">
        <span class="time-txt" id="timeTxt">00:00 / 00:00</span>
        <button onclick="player.prev()" title="上一曲">⏮</button>
        <button id="btnPlay" class="btn-main" onclick="player.togglePlay()" title="播放/暂停">▶</button>
        <button onclick="player.next()" title="下一曲">⏭</button>
        <button id="btnMode" class="btn-mode" onclick="toggleMode()" title="切换循环模式">🔁 列表</button>
      </div>
    </div>
  </footer>

  <script>
  (function (window) {
    'use strict';

    const DEFAULT_PLAYLIST = [
      {
        platform: 'tx',
        id: '0039MnYb0qxYhV',
        songmid: '0039MnYb0qxYhV',
        title: '晴天',
        artist: '周杰伦',
        album: '叶惠美',
        duration: 269,
        score: 100.0,
      },
      {
        platform: 'kw',
        id: '5886682',
        songmid: '5886682',
        title: '海阔天空',
        artist: 'Beyond',
        album: '乐与怒',
        duration: 326,
        score: 100.0,
      },
      {
        platform: 'wy',
        id: '347230',
        songmid: '347230',
        title: '海阔天空',
        artist: 'Beyond',
        album: '乐与怒',
        duration: 326,
        score: 100.0,
      },
      {
        platform: 'tx',
        id: '000T1Ws32MWrUj',
        songmid: '000T1Ws32MWrUj',
        title: '平凡之路',
        artist: '朴树',
        album: '猎户星座',
        duration: 301,
        score: 100.0,
      },
      {
        platform: 'tx',
        id: '001OyHbk2MSIi4',
        songmid: '001OyHbk2MSIi4',
        title: '十年',
        artist: '陈奕迅',
        album: '黑白灰',
        duration: 205,
        score: 100.0,
      },
    ];

    function formatClock(sec) {
      if (!sec || isNaN(sec)) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    class MusicPlayer {
      constructor() {
        this.audio = new Audio();
        this.audio.preload = 'auto';

        this.playlist = [...DEFAULT_PLAYLIST];
        this.currentIndex = -1;
        this.isDefaultList = true;
        this.playMode = 'loop';

        this.isResolving = false;
        this.isPlaying = false;
        this._playToken = 0;
        this._abortCtrl = null;

        this.lyrics = [];
        this.currentLyricIdx = -1;

        this.listeners = {
          trackChange: [],
          stateChange: [],
          timeUpdate: [],
          lyricUpdate: [],
          playlistChange: [],
        };

        this._bindAudioEvents();
      }

      _bindAudioEvents() {
        this.audio.addEventListener('play', () => {
          this.isPlaying = true;
          this._emit('stateChange', { isPlaying: true, isResolving: this.isResolving });
        });

        this.audio.addEventListener('pause', () => {
          this.isPlaying = false;
          this._emit('stateChange', { isPlaying: false, isResolving: this.isResolving });
        });

        this.audio.addEventListener('timeupdate', () => {
          const cur = this.audio.currentTime || 0;
          const dur = this.audio.duration || 0;
          const pct = dur > 0 ? (cur / dur) * 100 : 0;
          this._emit('timeUpdate', {
            currentTime: cur,
            duration: dur,
            percent: pct,
            formattedCurrent: formatClock(cur),
            formattedDuration: formatClock(dur),
          });
          this._syncLyrics(cur);
        });

        this.audio.addEventListener('ended', () => {
          this._handleTrackEnded();
        });

        this.audio.addEventListener('error', () => {
          this.isPlaying = false;
          this._emit('stateChange', {
            isPlaying: false,
            isResolving: false,
            error: '音频流加载失败（可能受防盗链或网络波动影响）',
          });
        });
      }

      _handleTrackEnded() {
        if (this.playMode === 'single') {
          this.audio.currentTime = 0;
          this.audio.play().catch(() => {});
        } else {
          this.next();
        }
      }

      _syncLyrics(currentTime) {
        if (!this.lyrics || this.lyrics.length === 0) return;

        let idx = -1;
        for (let i = 0; i < this.lyrics.length; i++) {
          if (currentTime >= this.lyrics[i].time) {
            idx = i;
          } else {
            break;
          }
        }

        if (idx !== this.currentLyricIdx) {
          this.currentLyricIdx = idx;
          const currentLine = idx >= 0 ? this.lyrics[idx].text : '';
          const nextLine = idx + 1 < this.lyrics.length ? this.lyrics[idx + 1].text : '';
          this._emit('lyricUpdate', {
            index: idx,
            currentLine,
            nextLine,
            allLines: this.lyrics,
          });
        }
      }

      async fetchLyrics(song, token) {
        this.lyrics = [];
        this.currentLyricIdx = -1;
        this._emit('lyricUpdate', {
          index: -1,
          currentLine: '正在匹配歌词...',
          nextLine: '',
          allLines: [],
        });

        try {
          const plat = encodeURIComponent(song.platform || 'kw');
          const sid = encodeURIComponent(song.id || '');
          const title = encodeURIComponent(song.title || '');
          const artist = encodeURIComponent(song.artist || '');
          const res = await fetch(
            `/api/lyric?platform=${plat}&id=${sid}&title=${title}&artist=${artist}`
          );
          const lines = await res.json();
          if (token !== this._playToken) return;
          this.lyrics = Array.isArray(lines) ? lines : [];
          if (this.lyrics.length === 0) {
            this._emit('lyricUpdate', {
              index: -1,
              currentLine: '纯音乐或暂无歌词',
              nextLine: '',
              allLines: [],
            });
          } else {
            this._syncLyrics(this.audio.currentTime || 0);
          }
        } catch {
          if (token !== this._playToken) return;
          this.lyrics = [];
          this._emit('lyricUpdate', {
            index: -1,
            currentLine: '暂无歌词',
            nextLine: '',
            allLines: [],
          });
        }
      }

      async playIndex(idx) {
        if (idx < 0 || idx >= this.playlist.length) return;

        if (this._abortCtrl) {
          this._abortCtrl.abort();
        }
        this._abortCtrl = new AbortController();
        const token = ++this._playToken;

        this.currentIndex = idx;
        const song = this.playlist[idx];
        this.isResolving = true;

        this._emit('trackChange', { index: idx, song });
        this._emit('stateChange', { isPlaying: false, isResolving: true, song });
        this.lyrics = [];
        this.currentLyricIdx = -1;
        this._emit('lyricUpdate', {
          index: -1,
          currentLine: '正在匹配音源与歌词...',
          nextLine: '',
          allLines: [],
        });

        try {
          const t0 = performance.now();
          const res = await fetch('/api/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(song),
            signal: this._abortCtrl.signal,
          });
          const data = await res.json();
          if (token !== this._playToken) return;

          const cost = (performance.now() - t0).toFixed(0);
          this.isResolving = false;

          if (data.success && data.url) {
            if (Array.isArray(data.lyrics) && data.lyrics.length > 0) {
              this.lyrics = data.lyrics;
              this._syncLyrics(0);
            } else {
              this.fetchLyrics(song, token);
            }
            this.audio.src = data.url;
            this.audio.play().catch((e) => console.warn('自动出声受阻:', e));
            this._emit('stateChange', {
              isPlaying: true,
              isResolving: false,
              song,
              sourceName: data.source_name,
              resolvedPlatform: data.platform,
              strategy: data.strategy,
              fallbackFrom: data.fallback_from,
              costMs: cost,
              bytes: data.bytes || 0,
            });
          } else {
            this._emit('stateChange', {
              isPlaying: false,
              isResolving: false,
              song,
              error: data.error || '所有音源通道均未通过校验',
            });
          }
        } catch (err) {
          if (err?.name === 'AbortError' || token !== this._playToken) return;
          this.isResolving = false;
          this._emit('stateChange', {
            isPlaying: false,
            isResolving: false,
            song,
            error: '网络错误: ' + err.message,
          });
        }
      }

      togglePlay() {
        if (!this.audio.src) {
          if (this.playlist.length > 0) {
            this.playIndex(this.currentIndex >= 0 ? this.currentIndex : 0);
          }
          return;
        }
        if (this.audio.paused) {
          this.audio.play().catch(() => {});
        } else {
          this.audio.pause();
        }
      }

      next() {
        if (this.playlist.length === 0) return;
        if (this.playMode === 'shuffle') {
          const nextIdx = Math.floor(Math.random() * this.playlist.length);
          this.playIndex(nextIdx);
        } else {
          const nextIdx = (this.currentIndex + 1) % this.playlist.length;
          this.playIndex(nextIdx);
        }
      }

      prev() {
        if (this.playlist.length === 0) return;
        let prevIdx = this.currentIndex - 1;
        if (prevIdx < 0) prevIdx = this.playlist.length - 1;
        this.playIndex(prevIdx);
      }

      seek(percent) {
        if (!this.audio.duration) return;
        const pct = Math.max(0, Math.min(1, percent));
        this.audio.currentTime = pct * this.audio.duration;
      }

      cycleMode() {
        if (this.playMode === 'loop') this.playMode = 'single';
        else if (this.playMode === 'single') this.playMode = 'shuffle';
        else this.playMode = 'loop';
        return this.playMode;
      }

      getModeLabel() {
        if (this.playMode === 'loop') return { mode: 'loop', icon: '🔁', label: '列表循环' };
        if (this.playMode === 'single') return { mode: 'single', icon: '🔂', label: '单曲循环' };
        return { mode: 'shuffle', icon: '🔀', label: '随机播放' };
      }

      setPlaylist(newList, autoPlayIndex = -1) {
        if (!Array.isArray(newList)) return;
        this.playlist = [...newList];
        this.currentIndex = -1;
        this.isDefaultList = false;
        this._emit('playlistChange', { playlist: this.playlist, isDefault: false });
        if (autoPlayIndex >= 0 && autoPlayIndex < this.playlist.length) {
          this.playIndex(autoPlayIndex);
        }
      }

      loadDefaultPlaylist() {
        this.playlist = [...DEFAULT_PLAYLIST];
        this.isDefaultList = true;
        this.currentIndex = -1;
        this._emit('playlistChange', { playlist: this.playlist, isDefault: true });
      }

      on(event, callback) {
        if (this.listeners[event]) {
          this.listeners[event].push(callback);
        }
      }

      _emit(event, data) {
        if (this.listeners[event]) {
          this.listeners[event].forEach((cb) => {
            try {
              cb(data);
            } catch (e) {
              console.error(e);
            }
          });
        }
      }
    }

    window.MusicPlayer = MusicPlayer;
  })(window);
  </script>
  <script>
    const player = new MusicPlayer();

    const PLAT_LABELS = {
      tx: { text: 'QQ', cls: 'plat-tx' },
      wy: { text: '网易', cls: 'plat-wy' },
      kw: { text: '酷我', cls: 'plat-kw' },
      kg: { text: '酷狗', cls: 'plat-kg' },
      mg: { text: '咪咕', cls: 'plat-mg' },
    };

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '--:--';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderPlatTag(plat) {
      const meta = PLAT_LABELS[plat] || { text: (plat || '?').toUpperCase(), cls: 'plat-kw' };
      return `<span class="plat-tag ${meta.cls}">${escapeHtml(meta.text)}</span>`;
    }

    async function loadSources() {
      try {
        const res = await fetch('/api/sources');
        const list = await res.json();
        renderSources(list, res.headers.get('X-Hub-Updated-At'));
      } catch {
        document.getElementById('sourceList').innerHTML =
          '<li style="color:#d93025;padding:8px 0;">音源加载失败 <button onclick="loadSources()">重试</button></li>';
      }
    }

    async function speedTest() {
      const btn = document.getElementById('btnSpeed');
      btn.innerText = '实测中...';
      btn.disabled = true;
      try {
        const res = await fetch('/api/sources/test', { method: 'POST' });
        const list = await res.json();
        renderSources(list, res.headers.get('X-Hub-Updated-At'));
      } catch (e) {
        alert('测速异常: ' + e.message);
      } finally {
        btn.innerText = '⚡ 实测重排';
        btn.disabled = false;
      }
    }

    function renderSources(sources, headerUpdatedAt) {
      const ul = document.getElementById('sourceList');
      const titleEl = document.getElementById('sourcesTitle');
      const metaEl = document.getElementById('syncMeta');

      if (!Array.isArray(sources) || sources.length === 0) {
        titleEl.innerText = '音源模块 (0 源)';
        metaEl.innerText = '暂无可用音源，请先运行同步脚本';
        ul.innerHTML = '<li style="color:#888;padding:8px 0;">暂无音源</li>';
        return;
      }

      const okCount = sources.filter((s) => s.status === 'ok').length;
      titleEl.innerText = `音源模块 (${okCount > 0 ? okCount + '/' : ''}${sources.length} 源)`;
      const updated = headerUpdatedAt || sources[0]?.updated_at;
      if (updated) {
        const d = new Date(updated);
        metaEl.innerText = isNaN(d.getTime())
          ? `yy-lx-hub: ${updated}`
          : `yy-lx-hub 同步: ${d.toLocaleString('zh-CN', { hour12: false })}`;
      }

      ul.innerHTML = sources
        .map((s, idx) => {
          let statusClass = 'status-wait';
          let statusTxt = s.sample_latency_ms ? `~${s.sample_latency_ms}ms` : '待测';
          let itemCls = '';

          if (s.status === 'ok') {
            statusClass = 'status-ok';
            statusTxt =
              typeof s.latency_ms === 'number' && !isNaN(s.latency_ms)
                ? `${Math.round(s.latency_ms)}ms`
                : '正常';
            if (idx < 3) itemCls = 'top';
          } else if (s.status === 'fail') {
            statusClass = 'status-fail';
            statusTxt = '× 失效';
            itemCls = 'fail';
          }

          const modeBadge =
            s.matchMode === 'search'
              ? '<span class="mode-tag" title="按歌名搜索匹配">搜</span>'
              : '<span class="mode-tag" title="按平台 ID 精准解析">ID</span>';
          const titleAttr = escapeHtml(
            `${s.name || ''}${s.error ? ' | 错误: ' + s.error : ''}`
          );

          return `
            <li class="source-item ${itemCls}" title="${titleAttr}">
              <span class="source-name">
                ${renderPlatTag(s.platform)}
                ${modeBadge}
                <span>${escapeHtml(s.name || '未命名音源')}</span>
              </span>
              <span class="${statusClass}">${statusTxt}</span>
            </li>
          `;
        })
        .join('');
    }

    async function search() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const btn = document.getElementById('btnSearch');
      btn.innerText = '搜索中...';
      btn.disabled = true;
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const cands = await res.json();
        player.setPlaylist(cands, -1);
      } finally {
        btn.innerText = '搜索';
        btn.disabled = false;
      }
    }

    function showDefaultPlaylist() {
      player.loadDefaultPlaylist();
    }

    function renderSongTable(songs) {
      const tbody = document.getElementById('songList');
      if (!songs || songs.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="8" style="text-align:center;padding:30px;color:#888;">未搜到正版歌曲（已自动过滤翻唱/伴奏）</td></tr>';
        return;
      }

      tbody.innerHTML = songs
        .map((s, idx) => {
          const isCur = idx === player.currentIndex;
          let btnText = '▶';
          if (isCur) {
            if (player.isResolving) btnText = '...';
            else if (player.isPlaying) btnText = '⏸';
          }
          return `
            <tr class="${isCur ? 'playing' : ''}">
              <td>${idx + 1}</td>
              <td>${renderPlatTag(s.platform)}</td>
              <td><strong>${escapeHtml(s.title)}</strong></td>
              <td>${escapeHtml(s.artist)}</td>
              <td>${escapeHtml(s.album || '-')}</td>
              <td>${formatTime(s.duration)}</td>
              <td><span class="badge">${s.score || 90}分</span></td>
              <td><button class="play-action" onclick="player.playIndex(${idx})">${btnText}</button></td>
            </tr>
          `;
        })
        .join('');
    }

    player.on('playlistChange', () => renderSongTable(player.playlist));

    player.on('trackChange', ({ song }) => {
      document.getElementById('trackTitle').innerText = `${song.title} - ${song.artist}`;
      renderSongTable(player.playlist);
    });

    player.on('stateChange', (st) => {
      document.getElementById('btnPlay').innerText = st.isPlaying ? '⏸' : '▶';
      const metaEl = document.getElementById('trackMeta');
      if (st.isResolving) {
        metaEl.className = '';
        metaEl.innerText = '多通道并发竞速寻链中...';
      } else if (st.sourceName) {
        metaEl.className = '';
        const mb = ((st.bytes || 0) / (1024 * 1024)).toFixed(2);
        const fb = st.fallbackFrom ? ` (跨平台兜底:${st.fallbackFrom}->${st.resolvedPlatform})` : '';
        metaEl.innerText = `✓ ${st.sourceName} | ${st.costMs}ms | ${mb}MB${fb}`;
      } else if (st.error) {
        metaEl.className = 'err';
        metaEl.innerText = `× ${st.error}`;
      }
      renderSongTable(player.playlist);
    });

    player.on('timeUpdate', (t) => {
      document.getElementById('progressFill').style.width = `${t.percent}%`;
      document.getElementById('timeTxt').innerText = `${t.formattedCurrent} / ${t.formattedDuration}`;
    });

    player.on('lyricUpdate', (l) => {
      document.getElementById('lyricText').innerText = l.currentLine || '♪ 间奏 ♪';
    });

    function toggleMode() {
      player.cycleMode();
      const meta = player.getModeLabel();
      document.getElementById('btnMode').innerText = `${meta.icon} ${meta.label.slice(0, 2)}`;
    }

    function seek(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      player.seek((event.clientX - rect.left) / rect.width);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSources();
      renderSongTable(player.playlist);
    });
  </script>
</body>
</html>
