<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY-Music Core (Minimal)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #202124;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 主工作区分割：左侧音源栏 + 右侧主内容区 */
    .app-body {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* 左侧边栏：源与测试 */
    .sidebar {
      width: 250px;
      border-right: 1px solid #dadce0;
      background-color: #f8f9fa;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar-tools {
      display: flex;
      gap: 4px;
    }

    .btn-speed {
      font-size: 11px;
      padding: 3px 8px;
      background: #e8f0fe;
      color: #1a73e8;
      border: 1px solid #d2e3fc;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-speed:hover {
      background: #1a73e8;
      color: #fff;
    }

    .btn-link {
      font-size: 11px;
      padding: 3px 6px;
      background: #fff;
      color: #5f6368;
      border: 1px solid #dadce0;
      border-radius: 4px;
      text-decoration: none;
    }
    .btn-link:hover {
      background: #f1f3f4;
      color: #202124;
    }

    .source-list-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }

    .source-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 12px;
      border: 1px solid #e8eaed;
      background: #ffffff;
      transition: all 0.15s ease;
    }

    .source-item:hover {
      border-color: #dadce0;
      background-color: #f1f3f4;
    }

    .source-item.top-source {
      border-color: #ceead6;
      background: #f6fbf7;
    }

    .source-name-box {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .source-rank {
      font-size: 10px;
      font-weight: bold;
      color: #70757a;
      width: 16px;
      text-align: center;
    }

    .source-name {
      color: #202124;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-status {
      font-size: 11px;
      margin-left: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .status-ok { color: #1e8e3e; }
    .status-fail { color: #d93025; }
    .status-untested { color: #70757a; }

    /* 右侧主区域：搜索与歌曲列表 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 36px 12px 36px;
      overflow-y: auto;
    }

    .search-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #202124;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-subtitle {
      font-size: 12px;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .search-bar-row {
      display: flex;
      width: 100%;
      max-width: 680px;
      gap: 10px;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 16px;
      background: #fff;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: rgba(223, 225, 229, 0);
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }

    .search-input {
      width: 100%;
      height: 42px;
      border: none;
      outline: none;
      font-size: 15px;
      background: transparent;
    }

    .btn {
      height: 42px;
      padding: 0 20px;
      border: 1px solid #f8f9fa;
      background-color: #f8f9fa;
      color: #3c4043;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:hover {
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.3);
      border-color: #dadce0;
      background-color: #f8f9fa;
      color: #202124;
    }

    .btn-primary {
      background-color: #1a73e8;
      color: #ffffff;
      border: 1px solid #1a73e8;
    }

    .btn-primary:hover {
      background-color: #1557b0;
      border-color: #1557b0;
      color: #ffffff;
    }

    .feature-tips-row {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #70757a;
    }
    .tip-tag {
      background: #f1f3f4;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* 歌曲列表区域 */
    .song-list-container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .song-list-header {
      font-size: 13px;
      color: #70757a;
      padding-bottom: 8px;
      border-bottom: 1px solid #ebebeb;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tab-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tab-btn {
      background: none;
      border: 1px solid transparent;
      padding: 3px 10px;
      font-size: 12px;
      border-radius: 12px;
      cursor: pointer;
      color: #5f6368;
    }
    .tab-btn.active {
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 500;
      border-color: #d2e3fc;
    }

    .song-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 6px;
      border-bottom: 1px solid #f1f3f4;
      font-size: 14px;
      transition: background 0.1s;
    }

    .song-item:hover {
      background-color: #f8f9fa;
    }

    .song-item.playing {
      background-color: #e8f0fe;
      border-left: 3px solid #1a73e8;
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .song-index {
      width: 22px;
      color: #70757a;
      font-size: 12px;
    }

    .platform-badge {
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 500;
    }
    .platform-kw { background: #fff0f0; color: #d93025; }
    .platform-wy { background: #fce8e6; color: #c5221f; }

    .score-badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      background: #e6f4ea;
      color: #137333;
      font-weight: 500;
    }

    .song-title-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .song-title {
      font-weight: 500;
      color: #1a0dab;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-sub {
      font-size: 12px;
      color: #5f6368;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-duration {
      font-size: 12px;
      color: #70757a;
      font-variant-numeric: tabular-nums;
      margin-right: 12px;
    }

    .play-btn {
      background: #ffffff;
      border: 1px solid #dadce0;
      color: #1a73e8;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .play-btn:hover {
      background-color: #e8f0fe;
      border-color: #1a73e8;
    }

    .play-btn.resolving {
      color: #e37400;
      border-color: #f9ab00;
      background: #fef7e0;
      cursor: wait;
    }

    /* 空状态卡片 */
    .empty-card {
      padding: 32px 20px;
      text-align: center;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px dashed #dadce0;
      margin-top: 10px;
    }
    .empty-card-title {
      font-size: 15px;
      font-weight: 500;
      color: #3c4043;
      margin-bottom: 6px;
    }
    .empty-card-desc {
      font-size: 12px;
      color: #70757a;
      line-height: 1.6;
    }

    /* 底部控制台：进度条 + 播控 + 双行歌词/解析状态 */
    .player-footer {
      border-top: 1px solid #dadce0;
      background: #ffffff;
      padding: 8px 24px 10px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-section {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-label {
      font-size: 12px;
      color: #70757a;
      width: 42px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-container {
      flex: 1;
      height: 6px;
      background-color: #e0e0e0;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #1a73e8;
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .buttons-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: none;
      border: 1px solid #dadce0;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      color: #3c4043;
      transition: all 0.15s;
    }

    .ctrl-btn:hover {
      background-color: #f1f3f4;
      border-color: #bdc1c6;
    }

    .ctrl-btn.mode-btn {
      border-radius: 14px;
      width: auto;
      padding: 0 10px;
      font-size: 12px;
      gap: 4px;
    }

    .ctrl-btn.play-pause {
      width: 38px;
      height: 38px;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      font-size: 15px;
    }

    .ctrl-btn.play-pause:hover {
      background-color: #1557b0;
    }

    /* 最底部：双行歌词与状态区 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      background-color: #f8f9fa;
      border-radius: 6px;
      padding: 0 12px;
      gap: 16px;
    }

    .track-info-tag {
      font-weight: 500;
      font-size: 12px;
      color: #202124;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    /* 双行歌词展示中心 */
    .lyrics-display-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      line-height: 1.25;
    }

    .lyric-line-current {
      font-size: 13px;
      font-weight: 600;
      color: #1a73e8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 480px;
      transition: color 0.2s;
    }

    .lyric-line-next {
      font-size: 11px;
      color: #80868b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 480px;
    }

    .stream-meta-tag {
      font-family: monospace;
      font-size: 11px;
      color: #137333;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="app-body">
    <!-- 左侧边栏：源与测试 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">音源梯队</span>
        <div class="sidebar-tools">
          <button class="btn-speed" id="btnSpeedTest" onclick="speedTestAll()">⚡测速重排</button>
          <a href="/sources.html" target="_blank" class="btn-link" title="全功能测试面板">监控台↗</a>
        </div>
      </div>
      <div class="source-list-scroll" id="sourceList">
        <div style="font-size:12px;color:#70757a;text-align:center;padding:20px 0;">加载音源中...</div>
      </div>
    </aside>

    <!-- 右侧主体：极简搜索页面风格 -->
    <main class="main-content">
      <div class="search-section">
        <div class="brand-title">
          <span>YY-Music</span>
          <span class="brand-subtitle">轻量双核底层</span>
        </div>

        <!-- 搜索条 -->
        <div class="search-bar-row">
          <div class="input-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="输入歌名、歌手（支持繁简/错字，如：海扩天空 Beyond）..." value="海阔天空 Beyond" onkeydown="if(event.key==='Enter') handleSearch()">
          </div>
          <button class="btn btn-primary" id="searchBtn" onclick="handleSearch()">搜索</button>
        </div>

        <div class="feature-tips-row">
          <span class="tip-tag">✓ 系统级 OpenCC 繁简直转 (0.05ms)</span>
          <span class="tip-tag">✓ 错别字与乱序容错打分</span>
          <span class="tip-tag">✓ 负面词 -60 分防翻唱/伴奏</span>
          <span class="tip-tag">✓ 双核并发竞速取链 (&gt;1.5MB 真实音频)</span>
        </div>
      </div>

      <!-- 歌曲列表区域 (支持默认精选与搜索结果切换) -->
      <div class="song-list-container">
        <div class="song-list-header">
          <div class="tab-group">
            <button class="tab-btn active" id="tabBtnDefault" onclick="switchToDefaultList()">🎵 默认精选歌单</button>
            <button class="tab-btn" id="tabBtnSearch" onclick="switchToSearchList()">🔍 搜索结果</button>
          </div>
          <span id="activeSourceInfo" style="font-size:12px;color:#1a73e8;">双核并发取链已就绪</span>
        </div>
        <ul class="song-list" id="songList">
          <!-- 动态渲染歌曲列表 -->
        </ul>
      </div>
    </main>
  </div>

  <!-- 底部播放栏：进度条 + 控制键 + 实时双行歌词 -->
  <footer class="player-footer">
    <div class="player-controls-row">
      <!-- 进度条 -->
      <div class="progress-section">
        <span class="time-label" id="currentTime">00:00</span>
        <div class="progress-bar-container" id="progressBar" onclick="seekAudio(event)">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="time-label" id="totalTime">00:00</span>
      </div>

      <!-- 控制按键：循环模式、上一曲、播放/暂停、下一曲 -->
      <div class="buttons-group">
        <button class="ctrl-btn mode-btn" id="modeBtn" title="切换播放模式" onclick="cyclePlayMode()">🔁 列表循环</button>
        <button class="ctrl-btn" title="上一曲" onclick="player.prev()">⏮</button>
        <button class="ctrl-btn play-pause" id="playPauseBtn" title="播放 / 暂停" onclick="player.togglePlay()">▶</button>
        <button class="ctrl-btn" title="下一曲" onclick="player.next()">⏭</button>
      </div>
    </div>

    <!-- 底部双行歌词与状态区 -->
    <div class="status-bar">
      <span class="track-info-tag" id="currentTrackLabel">[待播放] 欢迎体验 YY-Music</span>

      <!-- 歌词中心 -->
      <div class="lyrics-display-center">
        <div class="lyric-line-current" id="lyricRowCurrent">点击上方曲目即可秒级播放</div>
        <div class="lyric-line-next" id="lyricRowNext">实时歌词将在此毫秒级对齐展示</div>
      </div>

      <span class="stream-meta-tag" id="streamMetaTag">就绪</span>
    </div>
  </footer>

  <!-- 引入独立的播放模块 -->
  <script src="/player.js"></script>

  <script>
    // 初始化独立播放模块实例
    const player = new MusicPlayer();

    let searchResults = [];
    let currentView = 'default'; // 'default' 或 'search'

    // ==========================================
    // 1. 播放模块事件监听与 UI 同步
    // ==========================================

    player.on('stateChange', (data) => {
      const btn = document.getElementById('playPauseBtn');
      btn.innerText = data.isPlaying ? "⏸" : "▶";

      if (data.isResolving) {
        document.getElementById('currentTrackLabel').innerText = `[⚡竞速取链] ${data.song.artist} - ${data.song.title}`;
        document.getElementById('streamMetaTag').innerText = "并发冲刺前两名主力音源...";
      } else if (data.isPlaying) {
        document.getElementById('currentTrackLabel').innerText = `[播放中] ${data.song.artist} - ${data.song.title}`;
        if (data.sourceName) {
          const mb = (data.bytes / (1024 * 1024)).toFixed(2);
          document.getElementById('streamMetaTag').innerText = `✓ ${data.sourceName} | 耗时: ${data.costMs}ms | ${mb}MB`;
        }
      } else if (data.error) {
        document.getElementById('currentTrackLabel').innerText = `[失败] ${data.song ? data.song.title : ''}`;
        document.getElementById('streamMetaTag').innerText = `× ${data.error}`;
      }
      renderCurrentList();
    });

    player.on('trackChange', (data) => {
      renderCurrentList();
    });

    player.on('timeUpdate', (data) => {
      document.getElementById('currentTime').innerText = data.formattedCurrent;
      document.getElementById('totalTime').innerText = data.formattedDuration;
      document.getElementById('progressFill').style.width = `${data.percent}%`;
    });

    player.on('lyricUpdate', (data) => {
      document.getElementById('lyricRowCurrent').innerText = data.currentLine || "♪ 间奏 ♪";
      document.getElementById('lyricRowNext').innerText = data.nextLine || "";
    });

    player.on('playlistChange', () => {
      renderCurrentList();
    });

    // 切换循环模式
    function cyclePlayMode() {
      player.cycleMode();
      const meta = player.getModeLabel();
      document.getElementById('modeBtn').innerText = `${meta.icon} ${meta.label}`;
    }

    // 拖动进度条
    function seekAudio(event) {
      const rect = document.getElementById('progressBar').getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      player.seek(pct);
    }

    // ==========================================
    // 2. 歌单渲染与视图切换
    // ==========================================

    function switchToDefaultList() {
      currentView = 'default';
      document.getElementById('tabBtnDefault').classList.add('active');
      document.getElementById('tabBtnSearch').classList.remove('active');
      player.loadDefaultPlaylist();
    }

    function switchToSearchList() {
      currentView = 'search';
      document.getElementById('tabBtnSearch').classList.add('active');
      document.getElementById('tabBtnDefault').classList.remove('active');
      if (searchResults.length > 0) {
        player.setPlaylist(searchResults, -1);
      } else {
        renderSongList([]);
      }
    }

    function renderCurrentList() {
      renderSongList(player.playlist);
    }

    function renderSongList(songs) {
      const container = document.getElementById('songList');
      container.innerHTML = '';

      if (songs.length === 0) {
        container.innerHTML = `
          <div class="empty-card">
            <div class="empty-card-title">🔍 未找到符合正版阈值的单曲</div>
            <div class="empty-card-desc">
              系统已根据 1ms 前置打分模型自动拦截了非正规翻唱、纯伴奏或不相关关联曲目。<br>
              您可以尝试更换关键词或点击上方【🎵 默认精选歌单】直接试听。
            </div>
          </div>
        `;
        return;
      }

      songs.forEach((song, idx) => {
        const isCurrent = (idx === player.currentIndex);
        const li = document.createElement('li');
        li.className = `song-item ${isCurrent ? 'playing' : ''}`;

        const m = Math.floor(song.duration / 60);
        const s = Math.floor(song.duration % 60);
        const durStr = song.duration ? `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}` : '--:--';

        const platClass = song.platform === 'kw' ? 'platform-kw' : 'platform-wy';
        const platName = song.platform === 'kw' ? '酷我' : '网易';

        let btnText = "▶ 播放";
        if (isCurrent) {
          if (player.isResolving) btnText = "⚡取链中...";
          else if (player.isPlaying) btnText = "⏸ 播放中";
          else btnText = "▶ 继续";
        }

        li.innerHTML = `
          <div class="song-info">
            <span class="song-index">${idx + 1}</span>
            <span class="platform-badge ${platClass}">${platName}</span>
            <div class="song-title-group">
              <span class="song-title" onclick="player.playIndex(${idx})">${song.title}</span>
              <span class="song-sub">${song.artist} · ${song.album || '单曲'}</span>
            </div>
            <span class="score-badge">🎯 ${song.score || 90}分</span>
            <span class="song-duration">${durStr}</span>
          </div>
          <button class="play-btn ${isCurrent && player.isResolving ? 'resolving' : ''}" onclick="player.playIndex(${idx})">${btnText}</button>
        `;
        container.appendChild(li);
      });
    }

    // ==========================================
    // 3. 搜索与音源侧边栏交互
    // ==========================================

    async function handleSearch() {
      const kw = document.getElementById('searchInput').value.trim();
      if (!kw) return;

      const btn = document.getElementById('searchBtn');
      btn.innerText = "搜索中...";
      btn.disabled = true;

      try {
        const t0 = performance.now();
        const res = await fetch(`/api/search?q=${encodeURIComponent(kw)}`);
        const cands = await res.json();
        const cost = (performance.now() - t0).toFixed(0);

        searchResults = cands;
        currentView = 'search';
        document.getElementById('tabBtnSearch').classList.add('active');
        document.getElementById('tabBtnDefault').classList.remove('active');

        player.setPlaylist(cands, -1);
      } catch (e) {
        alert("搜索失败: " + e.message);
      } finally {
        btn.innerText = "搜索";
        btn.disabled = false;
      }
    }

    async function loadSources() {
      try {
        const res = await fetch('/api/sources');
        const sources = await res.json();
        renderSidebarSources(sources);
      } catch (err) {
        console.error("加载音源失败", err);
      }
    }

    function renderSidebarSources(sources) {
      const container = document.getElementById('sourceList');
      container.innerHTML = '';
      sources.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = `source-item ${idx < 2 ? 'top-source' : ''}`;
        
        let statusHtml = '';
        if (s.status === 'ok') {
          statusHtml = `<span class="source-status status-ok">● ${s.latency_ms.toFixed(0)}ms</span>`;
        } else if (s.status === 'fail') {
          statusHtml = `<span class="source-status status-fail">× 异常</span>`;
        } else {
          statusHtml = `<span class="source-status status-untested">○ 未测</span>`;
        }

        div.innerHTML = `
          <div class="source-name-box" title="${s.name} (${s.platform})">
            <span class="source-rank">${idx + 1}</span>
            <span class="source-name">${s.name}</span>
          </div>
          ${statusHtml}
        `;
        container.appendChild(div);
      });
    }

    async function speedTestAll() {
      const btn = document.getElementById('btnSpeedTest');
      btn.innerText = "测速中...";
      btn.disabled = true;
      try {
        const res = await fetch('/api/sources/test', { method: 'POST' });
        const sources = await res.json();
        renderSidebarSources(sources);
      } catch (e) {
        alert("测速异常：" + e.message);
      } finally {
        btn.innerText = "⚡测速重排";
        btn.disabled = false;
      }
    }

    // 页面启动初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadSources();
      renderCurrentList();
    });
  </script>
</body>
</html>
