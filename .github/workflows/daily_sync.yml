name: Daily Sync Music Sources

on:
  schedule:
    # 每天 UTC 20:00 (北京时间每天凌晨 04:00) 自动执行
    - cron: '0 20 * * *'
  # 支持在网页上一键手动测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行同步
        run: python3 sync_sources.py

      - name: 自动提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/sources.js
          git diff --staged --quiet || (git commit -m "chore(auto): 自动更新最新 36 音源清单 [skip ci]" && git push)
