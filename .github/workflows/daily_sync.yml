name: Daily Sync yy-lx-hub Sources

on:
  schedule:
    # 每天 UTC 21:00 (北京时间 05:00，在 yy-lx-hub 04:00 巡航完成之后) 自动同步
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 从 yy-lx-hub 拉取并验签最新音源
        env:
          AMUSIC_SYNC_KEY: ${{ secrets.AMUSIC_SYNC_KEY }}
          AMUSIC_SYNC_SECRET: ${{ secrets.AMUSIC_SYNC_SECRET }}
        run: node scripts/sync.mjs

      - name: 自动提交更新（触发 Vercel 自动重新部署）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add core/apis_bundle.js
          git diff --staged --quiet || (git commit -m "chore(sync): 同步 yy-lx-hub 最新音源清单" && git push)
